<svg xmlns="http://www.w3.org/2000/svg" width="1084" height="180" viewBox="0 0 1084 180" preserveAspectRatio="xMidYMid" role="img" aria-labelledby="title description">
  <title id="title">Matrix digital rain</title>
  <desc id="description">Japanese characters descend in glowing green columns on a black background.</desc>
  <defs>
    <pattern id="matrix-rain" width="184" height="180" patternUnits="userSpaceOnUse">
      <g fill="#34ff00" font-family="Courier New, monospace" font-size="17">
        <text x="7" y="-5"><tspan style="animation-delay:-1.8s">Ｘ</tspan><tspan x="7" dy="18" style="animation-delay:-1.7s">リ</tspan><tspan x="7" dy="18" style="animation-delay:-1.6s">オ</tspan><tspan x="7" dy="18" style="animation-delay:-1.5s">ツ</tspan><tspan x="7" dy="18" style="animation-delay:-1.4s">ネ</tspan><tspan x="7" dy="18" style="animation-delay:-1.3s">キ</tspan><tspan x="7" dy="18" style="animation-delay:-1.2s">ミ</tspan><tspan x="7" dy="18" style="animation-delay:-1.1s">ロ</tspan><tspan x="7" dy="18" style="animation-delay:-1s">ク</tspan><tspan x="7" dy="18" style="animation-delay:-.9s">セ</tspan></text>
        <text x="33" y="35"><tspan style="animation-delay:-1.4s">Ｏ</tspan><tspan x="33" dy="18" style="animation-delay:-1.3s">ヨ</tspan><tspan x="33" dy="18" style="animation-delay:-1.2s">ナ</tspan><tspan x="33" dy="18" style="animation-delay:-1.1s">ユ</tspan><tspan x="33" dy="18" style="animation-delay:-1s">ラ</tspan><tspan x="33" dy="18" style="animation-delay:-.9s">２</tspan><tspan x="33" dy="18" style="animation-delay:-.8s">リ</tspan><tspan x="33" dy="18" style="animation-delay:-.7s">Ｌ</tspan><tspan x="33" dy="18" style="animation-delay:-.6s">Ａ</tspan></text>
        <text x="59" y="-23"><tspan style="animation-delay:-1.7s">テ</tspan><tspan x="59" dy="18" style="animation-delay:-1.6s">Ｙ</tspan><tspan x="59" dy="18" style="animation-delay:-1.5s">モ</tspan><tspan x="59" dy="18" style="animation-delay:-1.4s">ケ</tspan><tspan x="59" dy="18" style="animation-delay:-1.3s">メ</tspan><tspan x="59" dy="18" style="animation-delay:-1.2s">ネ</tspan><tspan x="59" dy="18" style="animation-delay:-1.1s">Ｂ</tspan><tspan x="59" dy="18" style="animation-delay:-1s">ロ</tspan><tspan x="59" dy="18" style="animation-delay:-.9s">ラ</tspan><tspan x="59" dy="18" style="animation-delay:-.8s">Ｇ</tspan></text>
        <text x="85" y="17"><tspan style="animation-delay:-1.2s">ア</tspan><tspan x="85" dy="18" style="animation-delay:-1.1s">ノ</tspan><tspan x="85" dy="18" style="animation-delay:-1s">Ｒ</tspan><tspan x="85" dy="18" style="animation-delay:-.9s">Ａ</tspan><tspan x="85" dy="18" style="animation-delay:-.8s">ク</tspan><tspan x="85" dy="18" style="animation-delay:-.7s">Ｄ</tspan><tspan x="85" dy="18" style="animation-delay:-.6s">Ｓ</tspan><tspan x="85" dy="18" style="animation-delay:-.5s">Ｌ</tspan><tspan x="85" dy="18" style="animation-delay:-.4s">Ｅ</tspan></text>
        <text x="111" y="-11"><tspan style="animation-delay:-1.9s">エ</tspan><tspan x="111" dy="18" style="animation-delay:-1.8s">５</tspan><tspan x="111" dy="18" style="animation-delay:-1.7s">タ</tspan><tspan x="111" dy="18" style="animation-delay:-1.6s">ユ</tspan><tspan x="111" dy="18" style="animation-delay:-1.5s">ネ</tspan><tspan x="111" dy="18" style="animation-delay:-1.4s">Ｄ</tspan><tspan x="111" dy="18" style="animation-delay:-1.3s">オ</tspan><tspan x="111" dy="18" style="animation-delay:-1.2s">ツ</tspan><tspan x="111" dy="18" style="animation-delay:-1.1s">ム</tspan><tspan x="111" dy="18" style="animation-delay:-1s">Ｑ</tspan></text>
        <text x="137" y="43"><tspan style="animation-delay:-1.5s">８</tspan><tspan x="137" dy="18" style="animation-delay:-1.4s">Ｅ</tspan><tspan x="137" dy="18" style="animation-delay:-1.3s">ユ</tspan><tspan x="137" dy="18" style="animation-delay:-1.2s">ル</tspan><tspan x="137" dy="18" style="animation-delay:-1.1s">６</tspan><tspan x="137" dy="18" style="animation-delay:-1s">Ｊ</tspan><tspan x="137" dy="18" style="animation-delay:-.9s">Ｕ</tspan><tspan x="137" dy="18" style="animation-delay:-.8s">ヒ</tspan></text>
        <text x="163" y="-31"><tspan style="animation-delay:-1.1s">Ｎ</tspan><tspan x="163" dy="18" style="animation-delay:-1s">メ</tspan><tspan x="163" dy="18" style="animation-delay:-.9s">ホ</tspan><tspan x="163" dy="18" style="animation-delay:-.8s">ヰ</tspan><tspan x="163" dy="18" style="animation-delay:-.7s">Ｆ</tspan><tspan x="163" dy="18" style="animation-delay:-.6s">ノ</tspan><tspan x="163" dy="18" style="animation-delay:-.5s">９</tspan><tspan x="163" dy="18" style="animation-delay:-.4s">Ｙ</tspan><tspan x="163" dy="18" style="animation-delay:-.3s">Ｈ</tspan><tspan x="163" dy="18" style="animation-delay:-.2s">オ</tspan></text>
      </g>
    </pattern>
    <style>
      text tspan {
        animation: matrix-rain 1s linear infinite;
      }
      @keyframes matrix-rain {
        0% { opacity: 1; fill: #c5ff10; }
        10% { opacity: 1; fill: #34ff00; }
        50%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        text, text tspan { animation: none; }
      }
    </style>
  </defs>
  <rect width="1084" height="180" fill="#000"/>
  <rect width="1084" height="180" fill="url(#matrix-rain)"/>
</svg>
